<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
 xmlns:h="http://xmlns.jcp.org/jsf/html"
 xmlns:p="http://primefaces.org/ui">

    <h:head>
        <link rel="stylesheet" type="text/css" href="./resources/css/default.css"/>
        <link rel="stylesheet" type="text/css" href="./resources/css/cssLayout.css"/>
        <title>Skynet Web System</title>
    </h:head>
    
    <h:body> <h:outputStylesheet library="css" name="cssLayout.css" />
        <div class="login-container-dark">
            
            <div class="login-card-dark">
                
                <h:form id="loginForm">
                    <center>
                        <img src="./Imagenes/logoSkynet.png" class="login-logo"/>
                    </center>

                    <h1 class="company-title">SKYNET S.A.</h1>                    
                    
                    <!-- para muestra de mensajes de PrimeFaces-->
                    <p:growl id="growl" showDetail="true" sticky="false"/>
                    
                    <p:separator style="margin: 20px 0;"/>
                    
                    <div class="input-group">
                        <p:outputLabel for="Usuario" value="Usuario"/>
                        <p:inputText id="Usuario" value="#{indexControlador.usuario}" placeholder="Ingrese usuario" maxlength="20" requiredMessage="Ingrese usuario" required="true" styleClass="input-field"/>
                    </div>

                    <div class="input-group">
                        <p:outputLabel for="Contraseña" value="Contraseña"/>
                        <p:password id="Contraseña" value="#{indexControlador.password}" placeholder="Ingrese contraseña" maxlength="40" requiredMessage="Ingrese contraseña" required="true" styleClass="input-field"/>
                    </div>
                    
                    <p:commandButton value="Iniciar Sesión" action="#{indexControlador.validarDatos()}" update="loginForm" styleClass="login-button-dark" icon="ui-icon-key "/>
                </h:form>
                
            </div>
        </div>
        
    </h:body>
</html>

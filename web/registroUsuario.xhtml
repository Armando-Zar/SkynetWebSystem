<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./Template/Template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">

<style type="text/css">
    .ui-splitbutton {
        margin-right: .5rem;
    }
</style>

    <ui:define name="content">

        <h:form id="registroUsuarioForm" style="background-color: #0d0d0d;">

            <p:growl id="growl" showDetail="true" sticky="true" />

            <p:dock position="top">
                <p:menuitem title="Menú Principal" icon="./Imagenes/home.png" action="#{dock.navegacionDock()}"/>
            </p:dock>

            <center>

                <p:graphicImage style="margin-top: 5px;" url="./Imagenes/registros.png" width="900px" height="300px" />

                <table cellspacing="10px">

                    <!-- LOGIN NAME -->
                    <tr>
                        <td>
                            <p:outputLabel value="Nombre de Usuario:" />
                        </td>
                        <td>
                            <p:inputText value="#{registroUsuarioControlador.login_name}" style="width:180px" />
                        </td>

                        <td>
                            <p:outputLabel value="Password:" />
                        </td>
                        <td>
                            <p:password value="#{registroUsuarioControlador.password}" feedback="true" style="width:180px"/>
                        </td>
                    </tr>

                    <!-- ROL, SUPERVISOR, TECNICO -->
                    <tr>
                        <td>
                            <p:outputLabel value="Rol:" />
                        </td>
                        <td>
                            <p:selectOneMenu value="#{registroUsuarioControlador.id_rol}" style="width:165px" >
                                <f:selectItem itemLabel="Seleccione Rol" itemValue="-1" />
                                <f:selectItems value="#{registroUsuarioControlador.listaRol}" />
                            </p:selectOneMenu>
                        </td>

                        <td>
                            <p:outputLabel value="Supervisor:" />
                        </td>
                        <td>
                            <p:selectOneMenu value="#{registroUsuarioControlador.id_supervisor}" style="width:165px" >
                                <f:selectItem itemLabel="Si Aplica" itemValue="-1" />
                                <f:selectItems value="#{registroUsuarioControlador.listaSupervisor}" />
                            </p:selectOneMenu>
                        </td>
                    </tr>

                    <!-- TECNICO + ESTADO -->
                    <tr>
                        <td>
                            <p:outputLabel value="Técnico:" />
                        </td>
                        <td>
                            <p:selectOneMenu value="#{registroUsuarioControlador.id_tecnico}" style="width:165px" >
                                <f:selectItem itemLabel="Si Aplica" itemValue="-1" />
                                <f:selectItems value="#{registroUsuarioControlador.listaTecnico}" />
                            </p:selectOneMenu>
                        </td>

                        <td>
                            <p:outputLabel value="Estado:" />
                        </td>
                        <td>
                            <p:selectOneMenu value="#{registroUsuarioControlador.estado}">
                                <f:selectItem itemValue="1" itemLabel="Activo" />
                                <f:selectItem itemValue="0" itemLabel="Inactivo" />
                            </p:selectOneMenu>
                        </td>
                    </tr>

                    <!-- BOTON REGISTRAR -->
                    <tr>
                        <td colspan="7" align="center">
                            <p:commandButton icon="ui-icon-pencil" value="Registrar Usuario"
                                             action="#{registroUsuarioControlador.registrarUsuario()}"
                                             update="registroUsuarioForm"/>
                        </td>
                    </tr>

                </table>

            </center>

        </h:form>

    </ui:define>

</ui:composition>

<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./Template/Template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">

<style type="text/css">
    .ui-splitbutton {
        margin-right: .5rem;
    }
</style>    
    
    <ui:define name="content">
        <h:form id="registroClienteform" style="background-color: #0d0d0d;">
            <p:growl id="growl" showDetail="true" sticky="true" />
            <p:dock position="top">
                <p:menuitem title="Menú Principal" icon="./Imagenes/home.png" action="#{dock.navegacionDock()}"/>
            </p:dock>
            <center>
                <p:graphicImage style="margin-top: 5px;" url="./Imagenes/nuevocl.jpg" width="900px" height="300px" />
                <table cellspacing="10px">
                    <tr>
                        <td>
                            <p:outputLabel value="Nombre Cliente: " />
                        </td>
                        <td>
                            <p:inputText value="#{registroClienteControlador.nombre}" /> 
                        </td>  
                        <td>
                            <p:outputLabel value="Direccion: " />
                        </td>
                        <td>
                            <p:inputText value="#{registroClienteControlador.direccion}" /> 
                        </td>                        
                    </tr>
                    
                    <tr>                                        
                        <td>
                            <p:outputLabel value="Telefono: " />
                        </td>
                        <td>
                            <p:inputText value="#{registroClienteControlador.telefono}" /> 
                        </td>
                        <td>
                            <p:outputLabel value="Email: " />
                        </td>
                        <td>
                            <p:inputText value="#{registroClienteControlador.email}" type="email" /> 
                        </td>
                    </tr>

                    <tr>                                        
                        <td>
                            <p:outputLabel value="Latitud: " />
                        </td>
                        <td>
                            <p:inputText value="#{registroClienteControlador.lat}" disabled="true" /> 
                        </td>
                        <td>
                            <p:outputLabel value="Longitud: " />
                        </td>
                        <td>
                            <p:inputText value="#{registroClienteControlador.lng}" disabled="true" /> 
                        </td>
                    </tr>                    

                    <tr>
                        <td colspan="7" align="center">
                            <p:commandButton icon="ui-icon-pencil" value="Registrar" action="#{registroClienteControlador.registrarCliente()}" update="registroClienteform"/>
                        </td>
                    </tr>
                </table>
            </center>                          
        </h:form>
    </ui:define>

</ui:composition>
